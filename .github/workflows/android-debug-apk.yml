name: Build Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sync game and check offline wrapper
        run: |
          python3 android/sync_game.py
          python3 android/tests/check_wrapper.py
          (cd android && node tests/check_web_asset.cjs)

      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SeventhDay-V0.3-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
